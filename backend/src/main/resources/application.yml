server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
    whitelabel:
      enabled: false

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:cloudflow-backend}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
  jackson:
    time-zone: UTC
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

logging:
  level:
    root: INFO
    com.cloudflow: INFO

cloudflow:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:15m}
    require-verified-email: ${REQUIRE_VERIFIED_EMAIL:true}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    worker-token: ${WORKER_TOKEN:}
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from: ${SMTP_FROM:no-reply@localhost}
    verification-url: ${MAIL_VERIFICATION_URL:http://localhost:5173/verify-email}
    reset-url: ${MAIL_RESET_URL:http://localhost:5173/reset-password}
    verification-ttl: ${MAIL_VERIFICATION_TTL:24h}
    reset-ttl: ${MAIL_RESET_TTL:30m}
  worker:
    heartbeat-timeout: ${WORKER_HEARTBEAT_TIMEOUT:30s}
    running-timeout: ${WORKER_RUNNING_TIMEOUT:2m}
    max-attempts: ${WORKER_MAX_ATTEMPTS:3}
    sweep-interval: ${WORKER_SWEEP_INTERVAL:30s}
    sweep-initial-delay: ${WORKER_SWEEP_INITIAL_DELAY:30s}
