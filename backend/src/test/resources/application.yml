# Stage 2 web tests boot without a database. This is not H2, and it does not apply migrations.
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:1/unused
    username: unused
    password: unused
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

cloudflow:
  security:
    jwt:
      secret: test-only-jwt-secret-must-be-32-bytes!!
      expiration: 15m
    require-verified-email: true
    cors-allowed-origins: http://localhost:5173
    worker-token: test-worker-token
  mail:
    host: ""
    port: 587
    username: ""
    password: ""
    from: no-reply@localhost
    verification-url: http://localhost:5173/verify-email
    reset-url: http://localhost:5173/reset-password
    verification-ttl: 24h
    reset-ttl: 30m
  worker:
    heartbeat-timeout: 30s
    running-timeout: 2m
    max-attempts: 3
    sweep-interval: 1h
    sweep-initial-delay: 1h
